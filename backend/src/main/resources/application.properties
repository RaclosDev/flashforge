# ═══════════════════════════════════════════════════════════
# FlashForge Backend — Application Properties
# ═══════════════════════════════════════════════════════════

spring.application.name=FlashForge

# ── Database (H2 for development) ──────────────────────────
spring.datasource.url=jdbc:h2:file:./data/flashforge;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── Flyway ─────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ────────────────────────────────────────────────────
jwt.secret=FlashForge2026SuperSecretKeyThatIsLongEnoughForHS256Algorithm!!
jwt.expiration=604800000

# ── Server ─────────────────────────────────────────────────
server.port=8080

# ── Jackson ────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
